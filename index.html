<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>桜の谷 Sakura Valley</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="可实时游览的日式樱花山谷体素景观：河流、红桥、茶屋、神社与五重塔，支持蓝调时刻、清晨与雨中三种氛围。">
<meta name="theme-color" content="#0d1222">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&family=Cormorant+Garamond:ital,wght@1,500&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600&text=%E6%A1%9C%E3%81%AE%E8%B0%B7%E6%98%A5&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: the valley fills the screen edge to edge; quiet glass controls sit on the edges, the
   title hangs vertically top-left like the label on a scroll painting, finished with a vermilion seal. */
:root {
  --night: #0d1222;            /* page + loader ground */
  --ink: #f4f1f3;              /* primary text on glass */
  --ink-dim: #b8bccb;          /* secondary text */
  --glass: rgba(15, 19, 34, 0.44);
  --glass-strong: rgba(15, 19, 34, 0.72);
  --hairline: rgba(255, 255, 255, 0.14);
  --sakura: #f2bccb;           /* active state, focus */
  --shu: #c4452f;              /* seal vermilion, used once */
  --font-title: "Shippori Mincho B1", "Noto Serif SC", "Hiragino Mincho ProN", "Songti SC", "STSong", serif;
  --font-ui: "Noto Serif SC", "Hiragino Mincho ProN", "Songti SC", "STSong", "SimSun", serif;
  --font-latin: "Cormorant Garamond", "Iowan Old Style", "Times New Roman", serif;
  --edge: max(18px, env(safe-area-inset-left, 0px));
  --edge-r: max(18px, env(safe-area-inset-right, 0px));
  --top: calc(env(safe-area-inset-top, 0px) + 18px);
  --bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--night); }
body {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  color: var(--ink); font-family: var(--font-ui); font-size: 14px;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none;
}
#stage { position: fixed; inset: 0; background: var(--night); }
#stage canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; cursor: grab; }
#stage canvas:active { cursor: grabbing; }

/* ---------- overlay UI ---------- */
.ui { position: fixed; inset: 0; pointer-events: none; z-index: 5; transition: opacity .45s ease; }
.ui.off { opacity: 0; }
.ui.off * { pointer-events: none !important; }
.ui > * { pointer-events: auto; }

.brand {
  position: absolute; top: var(--top); left: var(--edge);
  writing-mode: vertical-rl; display: flex; align-items: flex-start; gap: 12px;
  text-shadow: 0 1px 14px rgba(5, 8, 20, 0.55), 0 0 2px rgba(5, 8, 20, 0.4);
  pointer-events: none;
}
.brand h1 {
  margin: 0; font: 600 34px/1 var(--font-title); letter-spacing: 0.24em; color: var(--ink);
}
.brand .meta { display: flex; align-items: center; gap: 10px; }
.seal {
  writing-mode: horizontal-tb; display: grid; place-items: center; width: 24px; height: 24px;
  background: var(--shu); color: #fbefe9; border-radius: 3px; font: 600 14px/1 var(--font-title);
  box-shadow: 0 2px 10px rgba(80, 10, 0, 0.35); text-shadow: none;
}
.brand .mood-name { font: 500 14px/1 var(--font-ui); letter-spacing: 0.32em; color: var(--ink); }
.brand .latin { font: italic 500 15px/1 var(--font-latin); letter-spacing: 0.14em; color: var(--ink-dim); }

.glass {
  background: var(--glass); border: 1px solid var(--hairline);
  -webkit-backdrop-filter: blur(16px) saturate(1.25); backdrop-filter: blur(16px) saturate(1.25);
  box-shadow: 0 8px 30px rgba(4, 6, 16, 0.22);
}

.tools {
  position: absolute; top: var(--top); right: var(--edge-r);
  display: flex; gap: 2px; padding: 4px; border-radius: 999px;
}
.ibtn {
  position: relative; appearance: none; border: 0; margin: 0; width: 38px; height: 38px; border-radius: 50%;
  display: grid; place-items: center; background: transparent; color: var(--ink-dim); cursor: pointer;
  transition: background .2s, color .2s;
}
.ibtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ibtn:hover { color: var(--ink); background: rgba(255, 255, 255, 0.08); }
.ibtn[aria-pressed="true"] { color: var(--ink); background: rgba(242, 188, 203, 0.18); }
.ibtn .q { font: 600 13px/1 var(--font-ui); letter-spacing: 0; }
.ibtn:focus-visible, .seg button:focus-visible, .btn:focus-visible, #reveal:focus-visible { outline: 2px solid var(--sakura); outline-offset: 2px; }
.ibtn[data-tip]::after {
  content: attr(data-tip); position: absolute; top: calc(100% + 8px); left: 50%; transform: translate(-50%, -4px);
  padding: 6px 9px; border-radius: 6px; background: var(--glass-strong); color: var(--ink);
  font: 500 12px/1 var(--font-ui); letter-spacing: .08em; white-space: nowrap; opacity: 0; pointer-events: none;
  transition: opacity .18s, transform .18s;
}
@media (hover: hover) { .ibtn[data-tip]:hover::after { opacity: 1; transform: translate(-50%, 0); } }
.tools .sep { width: 1px; margin: 8px 3px; background: var(--hairline); }

.dock {
  position: absolute; left: var(--edge); right: var(--edge-r); bottom: var(--bottom);
  display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
  pointer-events: none;
}
.dock > * { pointer-events: auto; }
.group { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.group.right { align-items: flex-end; }
.group .cap {
  font: 500 11px/1 var(--font-ui); letter-spacing: 0.4em; color: var(--ink-dim); padding-left: 14px;
  text-shadow: 0 1px 8px rgba(5, 8, 20, 0.6);
}
.group.right .cap { padding-left: 0; padding-right: 10px; }
.seg { display: flex; gap: 2px; padding: 4px; border-radius: 999px; }
.seg button {
  appearance: none; border: 0; margin: 0; background: transparent; color: var(--ink-dim);
  font: 500 13px/1 var(--font-ui); letter-spacing: 0.1em; padding: 10px 15px; border-radius: 999px;
  cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: background .25s, color .25s, box-shadow .25s;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] {
  color: var(--ink); background: rgba(255, 255, 255, 0.13); box-shadow: inset 0 0 0 1px rgba(242, 188, 203, 0.42);
}
.sw { width: 10px; height: 10px; border-radius: 50%; flex: none; background: linear-gradient(160deg, var(--a), var(--b)); box-shadow: 0 0 0 1px rgba(255,255,255,.25); }

.hint {
  position: absolute; left: 50%; bottom: calc(var(--bottom) + 76px); transform: translateX(-50%);
  margin: 0; padding: 8px 14px; border-radius: 999px; max-width: calc(100% - 40px);
  font: 500 12px/1.4 var(--font-ui); letter-spacing: 0.12em; color: var(--ink); text-align: center;
  white-space: nowrap; transition: opacity .8s ease; pointer-events: none;
}
.hint.fade { opacity: 0; }
.toast {
  position: absolute; left: 50%; top: calc(var(--top) + 4px); transform: translate(-50%, -6px);
  padding: 9px 16px; border-radius: 999px; font: 500 13px/1.3 var(--font-ui); letter-spacing: .1em;
  opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; white-space: nowrap; max-width: calc(100% - 140px);
  overflow: hidden; text-overflow: ellipsis;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

#reveal {
  position: fixed; right: var(--edge-r); bottom: var(--bottom); z-index: 6; width: 40px; height: 40px; border-radius: 50%;
  display: grid; place-items: center; color: var(--ink); opacity: .35; cursor: pointer; border: 1px solid var(--hairline);
  transition: opacity .25s;
}
#reveal:hover, #reveal:focus-visible { opacity: 1; }
#reveal svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- loader / dialogs ---------- */
.loader {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
  background: radial-gradient(120% 90% at 50% 100%, #2b3560 0%, #151b35 46%, var(--night) 100%);
  transition: opacity .9s ease;
}
.loader.gone { opacity: 0; pointer-events: none; }
.ld { display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 0 24px; }
.ld-title { display: flex; align-items: center; gap: 14px; font: 600 40px/1 var(--font-title); letter-spacing: .3em; padding-left: .3em; }
.ld-bar { width: min(240px, 60vw); height: 1px; background: rgba(255,255,255,.14); overflow: hidden; }
.ld-bar i { display: block; height: 100%; background: linear-gradient(90deg, #f6d3dc, #f2bccb); transform-origin: left; transform: scaleX(0); transition: transform .4s ease; }
.ld-status { font: 500 12px/1 var(--font-ui); letter-spacing: .36em; color: var(--ink-dim); padding-left: .36em; min-height: 12px; }

.modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 20px; background: rgba(6, 8, 18, 0.55); }
.card {
  width: min(520px, calc(100vw - 40px)); max-height: calc(100vh - 40px); overflow: auto; box-sizing: border-box;
  padding: 22px; border-radius: 16px; background: rgba(18, 22, 40, 0.9); border: 1px solid var(--hairline);
  display: flex; flex-direction: column; gap: 14px;
  user-select: text; -webkit-user-select: text;
}
.card h2 { margin: 0; font: 600 18px/1.35 var(--font-ui); letter-spacing: .08em; text-wrap: balance; }
.card p { margin: 0; font: 500 14px/1.7 var(--font-ui); color: var(--ink-dim); }
.card pre { margin: 0; max-height: 120px; overflow: auto; padding: 10px; border-radius: 8px; background: rgba(0,0,0,.3); color: #d9c3c8; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
.card pre:empty { display: none; }
.shot-card { width: min(860px, calc(100vw - 40px)); }
.shot-card img { display: block; width: 100%; max-width: 100%; height: auto; max-height: 62vh; object-fit: contain; border-radius: 10px; background: #000; -webkit-touch-callout: default; user-select: auto; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn {
  appearance: none; border: 1px solid rgba(242, 188, 203, 0.5); background: rgba(242, 188, 203, 0.16); color: var(--ink);
  font: 500 14px/1 var(--font-ui); letter-spacing: .1em; padding: 11px 18px; border-radius: 999px; cursor: pointer; text-decoration: none;
}
.btn.ghost { border-color: var(--hairline); background: transparent; }
.fine { font-size: 12px !important; }

/* ---------- small screens ---------- */
@media (max-width: 760px) {
  .brand h1 { font-size: 27px; }
  .brand .latin { display: none; }
  .tools { flex-direction: column; border-radius: 22px; }
  .tools .sep { width: auto; height: 1px; margin: 3px 8px; }
  .ibtn[data-tip]::after { display: none; }
  .dock { flex-direction: column-reverse; align-items: stretch; gap: 10px; }
  .group, .group.right { align-items: stretch; }
  .group .cap { display: none; }
  .seg button { flex: 1 1 0; padding: 11px 6px; letter-spacing: .04em; min-width: 0; }
  .hint { bottom: calc(var(--bottom) + 112px); white-space: normal; width: max-content; max-width: calc(100% - 48px); }
  .toast { top: auto; bottom: calc(var(--bottom) + 116px); max-width: calc(100% - 48px); }
}
@media (max-height: 640px) {
  .brand .latin { display: none; }
}
@media (max-width: 380px) {
  .seg button { font-size: 12px; letter-spacing: 0; gap: 5px; }
  .ibtn { width: 34px; height: 34px; }
}
@media (max-height: 520px) and (min-width: 560px) {
  .tools { flex-direction: row; border-radius: 999px; }
  .tools .sep { width: 1px; height: auto; margin: 8px 3px; }
  .dock { flex-direction: row; align-items: flex-end; }
  .group .cap { display: none; }
  .seg button { flex: none; padding: 9px 12px; }
  .brand h1 { font-size: 24px; }
  .brand .latin { display: none; }
  .hint { display: none; }
  .toast { top: var(--top); bottom: auto; }
}
@media (prefers-reduced-motion: reduce) {
  .ui, .hint, .toast, .loader, .ld-bar i { transition: none; }
}
</style>
</head>
<body>
<div id="stage" aria-label="樱花山谷三维场景"></div>

<div class="ui" id="ui">
  <header class="brand">
    <h1>桜の谷</h1>
    <div class="meta"><span class="seal" aria-hidden="true">春</span><span class="mood-name" id="moodName">蓝调时刻</span><span class="latin">Sakura Valley</span></div>
  </header>

  <div class="tools glass" role="toolbar" aria-label="工具">
    <button class="ibtn" id="btnTour" type="button" data-tip="镜头巡游" aria-label="镜头巡游" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M5 18.5c2.5 0 3-3 6-3s3.5 2 6 0 1-6-2-6-3 2-5 1-1.5-4 2-4.5"/><circle cx="5" cy="18.5" r="1.6"/><path d="M14.5 3.2l2.3 1.8-2.3 1.8"/></svg>
    </button>
    <button class="ibtn" id="btnSound" type="button" data-tip="环境音" aria-label="环境音" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><g class="s-on" style="display:none"><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></g><g class="s-off"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></svg>
    </button>
    <button class="ibtn" id="btnQuality" type="button" data-tip="画质：高" aria-label="画质切换，当前为高">
      <span class="q" id="qLabel">高</span>
    </button>
    <span class="sep" aria-hidden="true"></span>
    <button class="ibtn" id="btnReset" type="button" data-tip="重置视角" aria-label="重置视角">
      <svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4 4.5v4h4"/></svg>
    </button>
    <button class="ibtn" id="btnShot" type="button" data-tip="保存画面" aria-label="保存当前画面">
      <svg viewBox="0 0 24 24"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.5-2h6l1.5 2h2A1.5 1.5 0 0 1 20 8.5v9A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.4"/></svg>
    </button>
    <button class="ibtn" id="btnFull" type="button" data-tip="全屏" aria-label="全屏">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button class="ibtn" id="btnHide" type="button" data-tip="隐藏界面 (H)" aria-label="隐藏界面">
      <svg viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Z"/><circle cx="12" cy="12" r="2.6"/><path d="M4 20 20 4"/></svg>
    </button>
  </div>

  <div class="dock">
    <div class="group">
      <span class="cap">镜头</span>
      <nav class="seg glass" id="views" aria-label="镜头">
        <button type="button" data-view="panorama" aria-pressed="true">山谷全景</button>
        <button type="button" data-view="river" aria-pressed="false">河边低机位</button>
        <button type="button" data-view="temple" aria-pressed="false">寺庙小径</button>
        <button type="button" data-view="overlook" aria-pressed="false">山坡俯瞰</button>
      </nav>
    </div>
    <div class="group right">
      <span class="cap">氛围</span>
      <div class="seg glass" id="moods" role="group" aria-label="氛围">
        <button type="button" data-mood="dusk" aria-pressed="true"><span class="sw" style="--a:#26335f;--b:#d99aa6"></span>蓝调</button>
        <button type="button" data-mood="dawn" aria-pressed="false"><span class="sw" style="--a:#9fbbe0;--b:#f6d2b0"></span>清晨</button>
        <button type="button" data-mood="rain" aria-pressed="false"><span class="sw" style="--a:#5d6672;--b:#a3abb4"></span>雨中</button>
      </div>
    </div>
  </div>

  <p class="hint glass" id="hint">拖动旋转 · 滚轮前进 · 右键平移 · WASD 漫步 · 双击聚焦 · H 隐藏界面</p>
  <div class="toast glass" id="toast" role="status" aria-live="polite"></div>
</div>

<button id="reveal" class="glass" type="button" aria-label="显示界面" hidden>
  <svg viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Z"/><circle cx="12" cy="12" r="2.6"/></svg>
</button>

<div class="loader" id="loader">
  <div class="ld">
    <div class="ld-title">桜の谷</div>
    <div class="ld-bar"><i id="ldFill"></i></div>
    <div class="ld-status" id="ldStatus">准备中</div>
  </div>
</div>

<div class="modal" id="fatal" hidden role="alertdialog" aria-modal="true" aria-labelledby="fatalTitle">
  <div class="card">
    <h2 id="fatalTitle">场景无法显示</h2>
    <p id="fatalMsg"></p>
    <pre id="fatalDetail"></pre>
    <div class="row"><button class="btn" id="fatalReload" type="button">重新加载</button></div>
  </div>
</div>

<div class="modal" id="shot" hidden role="dialog" aria-modal="true" aria-label="保存画面">
  <div class="card shot-card">
    <img id="shotImg" alt="当前画面截图">
    <div class="row">
      <a class="btn" id="shotDl" href="#" download="sakura-valley.png">下载 PNG</a>
      <button class="btn ghost" id="shotClose" type="button">关闭</button>
    </div>
    <p class="fine">如果点击下载没有反应，可右键或长按图片另存。</p>
  </div>
</div>

<script>
(function () {
  var byId = function (id) { return document.getElementById(id); };
  var boot = window.__boot = {
    started: false, failed: false, noWebGL: false,
    status: function (text, p) {
      boot.started = true;
      if (/[?&]test/.test(location.search)) console.log('[status]', text, p, Math.round(performance.now()) + 'ms');
      var s = byId('ldStatus'); if (s && text) s.textContent = text;
      var f = byId('ldFill'); if (f && p != null) f.style.transform = 'scaleX(' + Math.max(0, Math.min(1, p)) + ')';
    },
    fatal: function (title, msg, err) {
      if (boot.failed) return; boot.failed = true;
      byId('fatalTitle').textContent = title || '场景无法显示';
      byId('fatalMsg').textContent = msg || '';
      byId('fatalDetail').textContent = err ? String((err && (err.stack || err.message)) || err).slice(0, 900) : '';
      byId('fatal').hidden = false;
      var l = byId('loader'); if (l) l.classList.add('gone');
      if (err) console.error(err);
    },
    done: function () {
      var l = byId('loader'); l.classList.add('gone');
      setTimeout(function () { l.hidden = true; }, 950);
    }
  };
  byId('fatalReload').addEventListener('click', function () { location.reload(); });
  try {
    var c = document.createElement('canvas');
    var gl = c.getContext('webgl2');
    if (!gl) throw new Error('WebGL2 context unavailable');
  } catch (e) {
    boot.noWebGL = true;
    boot.fatal('当前浏览器无法显示 3D 场景', '没有检测到 WebGL 2。请使用新版 Chrome、Edge、Firefox 或 Safari 打开，并确认浏览器设置中已开启硬件加速。');
  }
  window.addEventListener('error', function (e) {
    if (!boot.ready) boot.fatal('场景载入失败', '脚本运行出错，请刷新重试。', e.error || e.message);
  });
  window.addEventListener('unhandledrejection', function (e) {
    if (!boot.ready) boot.fatal('场景载入失败', '资源或脚本未能正确载入，请检查网络后刷新。', e.reason);
  });
  setTimeout(function () {
    if (!boot.started && !boot.failed) boot.fatal('资源加载超时', '未能从 cdn.jsdelivr.net 载入 Three.js。请检查网络连接，或稍后重新加载。');
  }, 30000);
})();
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
// ============================================================================
//  桜の谷 · Sakura Valley — procedural voxel landscape (Three.js r170)
// ============================================================================
const BOOT = window.__boot;
if (BOOT.noWebGL) throw new Error('WebGL2 unavailable');
BOOT.status('载入渲染引擎', 0.02);

let THREE, OrbitControls, EffectComposer, RenderPass, UnrealBloomPass, OutputPass, ShaderPass, Reflector;
{

  shu: 0xb8432e, shuDark: 0x92321f, shuLight: 0xcb5a3f,
  tile: 0x3e4451, tileB: 0x48505e, tileEdge: 0x575f6d, ridge: 0x2b2f38,
  copper: 0x5d8e7f, copperB: 0x6b9d8c, copperEdge: 0x7cae9b, copperDark: 0x3f6a5e,
  thatch: 0x8a7354, thatchB: 0x9b8461, thatchC: 0x7b6548, thatchDark: 0x5c4b38, thatchRidge: 0x463b31,
  stone: 0x8e8b85, stoneB: 0x7c7973, stoneC: 0x9b9890, stoneDark: 0x66635e, moss: 0x5d6d42,
  paper: 0xf0e6d0, lanternRed: 0xc63f2b, lanternWhite: 0xf3e7d0, black: 0x24201d,
  gold: 0xc09a4f, bronze: 0x7f6c47, noren: 0x2c3c5e, norenMark: 0xe9e4d8, felt: 0xb7352b, straw: 0xc8af78, strawB: 0xb39a64, shide: 0xf6f3ec,

class VB {

  has(x, y, z) { return this.g.has(x - this.ox, y - this.oy, z - this.oz); }

const stoneFn = (k = 3) => (x, y, z) => {
  const r = hash3i(Math.floor(x / k), Math.floor(y / 2), Math.floor(z / k) + Math.floor(y / 2) * 7);
  return r < 0.33 ? AC.stone : r < 0.66 ? AC.stoneB : r < 0.9 ? AC.stoneC : AC.stoneDark;

const plankFn = (axis) => (x, y, z) => {

// Generic roof surface from a height function (voxel units).
function roofField(vb, x0, z0, x1, z1, Hf, o) {
  const W = x1 - x0 + 1, D = z1 - z0 + 1;
  const HH = new Float32Array(W * D);

  const thick = o.thick || 2;
  for (let z = z0; z <= z1; z++) for (let x = x0; x <= x1; x++) {
    const h = get(x, z);
    if (h < -1e8) continue;
    const top = Math.floor(h);
    let lo = top - thick + 1;
    const n1 = get(x + 1, z), n2 = get(x - 1, z), n3 = get(x, z + 1), n4 = get(x, z - 1);
    for (const hn of [n1, n2, n3, n4]) if (hn > -1e8) lo = Math.min(lo, Math.floor(hn) + 1);
    lo = Math.max(lo, top - 8);
    const inside = o.inner && x >= o.inner[0] && x <= o.inner[2] && z >= o.inner[1] && z <= o.inner[3];
    const gx = (n1 > -1e8 ? n1 : h) - (n2 > -1e8 ? n2 : h), gz = (n3 > -1e8 ? n3 : h) - (n4 > -1e8 ? n4 : h);
    const edge = n1 < -1e8 || n2 < -1e8 || n3 < -1e8 || n4 < -1e8;
    let tc;
    if (o.color) tc = o.color(x, z, top, gx, gz, edge);
    else {
      const along = Math.abs(gx) > Math.abs(gz) ? z : x;
      tc = edge ? o.edge : (((along % 2) + 2) % 2 === 0 ? o.tile : o.tileB);
    }
    for (let y = lo; y <= top; y++) {

      vb.set(x, y, z, c);

}
// fill vertical triangle under a roof on plane x = xp (z range), from y0 up to roof underside
function gableX(vb, xp, z0, z1, y0, Hf, colorFn, gap = 2) {
  for (let z = z0; z <= z1; z++) {
    const top = Math.floor(Hf(xp, z)) - gap;

  }
}
function gableZ(vb, zp, x0, x1, y0, Hf, colorFn, gap = 2) {
  for (let x = x0; x <= x1; x++) {
    const top = Math.floor(Hf(x, zp)) - gap;
    for (let y = y0; y <= top; y++) { const c = colorFn(x, y, top); if (c !== -1) vb.set(x, y, zp, c); }

}
// shoji / lattice: frame every `cell`
function shoji(u, v, cell = 3, e = E_PAPER) {
  return (u % cell === 0 || v % (cell + 1) === 0) ? AC.woodMid : [AC.paper, e];
}
function chochin(vb, x, y, z, color = AC.lanternRed, hang = 4) {
  vb.box(x - 1, y + 3, z - 1, x + 1, y + 3, z + 1, AC.black);
  vb.box(x - 1, y, z - 1, x + 1, y + 2, z + 1, (xx, yy, zz) => [(yy === y + 1 && (xx === x || zz === z)) ? shadeC(color, 1.08) : color, E_LANTERN]);
  vb.set(x, y - 1, z, AC.black);
  for (let k = 1; k <= hang; k++) vb.set(x, y + 3 + k, z, AC.woodDark);
}

function buildTeaHouse() {

  for (const pz of PZ) for (const px of [0, 33]) vb.box(px, 4, pz, px + 1, 15, pz + 1, AC.woodDark);

    for (let y = 4; y <= 14; y++) {
      let c;
      if (x >= 10 && x <= 16) { // doorway with noren
        if (y >= 11) c = (x === 12 || x === 15) ? -1 : ((y === 12 && x >= 13 && x <= 14) ? AC.norenMark : AC.noren);
        else c = -1;
      } else if (x >= 19 && x <= 25) { // round window

  // north + east walls
  for (let x = 2; x <= 32; x++) {
    if (isPostX(x)) continue;
    for (let y = 4; y <= 14; y++) {
      const win = x >= 19 && x <= 25 && y >= 8 && y <= 12;
      if (win) vb.set(x, y, 24, ...[].concat(shoji(x, y - 8, 3)));
      else vb.set(x, y, 24, y < 8 ? AC.wood : AC.plaster);
    }
  }
  for (let z = 2; z <= 22; z++) {
    if (isPostZ(z)) continue;
    for (let y = 4; y <= 14; y++) {
      const win = z >= 10 && z <= 14 && y >= 8 && y <= 12;
      if (win) vb.set(34, y, z, ...[].concat(shoji(z, y - 8, 3)));
      else vb.set(34, y, z, y < 8 ? AC.wood : AC.plaster);
    }
  }
  // top beam
  vb.box(0, 15, 0, 34, 15, 0, AC.woodDark); vb.box(0, 15, 24, 34, 15, 24, AC.woodDark);
  vb.box(0, 15, 0, 0, 15, 24, AC.woodDark); vb.box(34, 15, 0, 34, 15, 24, AC.woodDark);
  vb.box(1, 15, 1, 33, 15, 23, AC.woodDark);
  // roof: irimoya
  const rx0 = -12, rx1 = 45, rz0 = -7, rz1 = 31, y0 = 16, pitch = 0.55, k = 10;
  const Hf = (x, z) => {
    const rx = Math.min(x - rx0, rx1 - x), rz = Math.min(z - rz0, rz1 - z);
    return y0 + pitch * (rx < k ? Math.min(rx, rz) : rz);
  };
  roofField(vb, rx0, rz0, rx1, rz1, Hf, { tile: AC.tile, tileB: AC.tileB, edge: AC.tileEdge, under: (x, z) => ((x + z) % 2 ? AC.woodDark : AC.wood), inner: [0, 0, 34, 24], thick: 2 });

    vb.box(bx, 0, -10, bx + 8, 1, -10, (x) => (x === bx || x === bx + 8 ? AC.woodDark : -1));

function buildMachiya() {
  const vs = 0.2, lamps = [];
  const vb = new VB(-5, -6, -8, 35, 40, 45);
  vb.box(0, -6, 0, 29, 0, 39, stoneFn(4));

    const post = x <= 1 || x >= 28 || x === 14 || x === 15;
    if (post) { vb.set(x, y, 0, AC.woodDark); continue; }

      if (y >= 10) vb.set(x, y, 0, (x === 13 || x === 16) ? AC.noren : (y === 11 && (x === 11 || x === 18) ? AC.norenMark : AC.noren));
      vb.set(x, y, 2, AC.paper, E_PAPER + 25);

    }
    if (y <= 3) { vb.set(x, y, 0, AC.woodDark); continue; }

  vb.box(1, 2, 1, 28, 14, 1, (x, y, z) => (vb.has(x, y, 1) ? -1 : AC.woodDark));

  for (let x = 0; x <= 29; x++) for (let y = 2; y <= 24; y++) vb.set(x, y, 39, x % 10 === 0 || y === 14 ? AC.woodDark : y < 6 ? AC.wood : AC.plasterB);
  // second floor front
  for (let x = 0; x <= 29; x++) for (let y = 15; y <= 24; y++) {

  for (const xp of [0, 29]) gableX(vb, xp, 0, 39, 25, Hf, (z, y) => (y === 25 ? AC.woodDark : AC.plaster), 1);
  const zr = 19;

function buildPagoda() {

class InstGroup {

  build(scene) {
    if (!this.list.length) return null;
    const B = this.o.bucket || 150;
    const buckets = new Map();
    for (const it of this.list) {
      const k = Math.floor(it.x / B) * 1000 + Math.floor(it.z / B);

      buckets.get(k).push(it);

    const col = new THREE.Color();

    for (const items of buckets.values()) {
      const n = items.length;
      const geom = new THREE.BufferGeometry();

      geom.setIndex(this.geom.index);

        _m.compose(_p.set(it.x, it.y, it.z), _q, _s);

        lamp[i] = LAMPS.length && !this.o.noLamp ? Math.min(3.5, lampAt(it.x, it.y + (this.o.lampY || 1.2), it.z) * (this.o.lampK || 0.55)) : 0;
      }
      if (anyColor) for (let i = 0; i < n; i++) mesh.setColorAt(i, col.setHex(items[i].color ?? 0xffffff));

      if (this.o.layer) mesh.layers.set(this.o.layer);
      mesh.computeBoundingSphere();

    if (N2(x * 0.05 + 3, z * 0.05 + 20) > 0.42 && t.h < 40) { mapleG[Math.floor(rng() * 2)].add(x, groundMin(x, z, 0.4) - 0.1, z, rot4(), 0.8 + rng() * 0.45); continue; }
    if (t.slope > 0.9 && rng() < 0.12) { rockGr[2].add(x, t.h, z, rot4(), 0.8 + rng() * 0.8, 0xd8d8d8); continue; }
    const s = 0.75 + rng() * 0.5;
    if (dC < 95 && nearCedars < 260 * F) { cedarNG[Math.floor(rng() * 3)].add(x, groundMin(x, z, 0.5) - 0.2, z, rot4(), s); nearCedars++; }
    else if (rng() < 0.62) cedarFG[Math.floor(rng() * 2)].add(x, groundMin(x, z, 0.8) - 0.3, z, rot4(), s);
  }
  // far canopy boxes
  const farSpec = TERRAIN.chunks.find((c) => c.name === 'far');
  const fstep = 9 / Math.sqrt(F);
  for (let gz = -760; gz < 420; gz += fstep) for (let gx = -720; gx < 720; gx += fstep) {
    const x = gx + (rng() - 0.5) * fstep, z = gz + (rng() - 0.5) * fstep;
    if (inRect(farSpec.excl, x, z)) continue;
    const t = tinfo(x, z);
    if (t.h > 112 + N2(x * 0.01, z * 0.01) * 20 || t.slope > 1.1) continue;
    if (forest(x, z) < -0.35) continue;
    const g = [0x2f4a31, 0x36533a, 0x2b432e, 0x3c5c3d, 0x46663f][Math.floor(rng() * 5)];
    const w = 4 + rng() * 3.5, hh = 5 + rng() * 6;
    boxes.add(x, t.h - 1, z, w, hh, w * (0.8 + rng() * 0.4), g);
    if (rng() < 0.5) boxes.add(x + (rng() - 0.5) * 3, t.h - 1 + hh * 0.6, z + (rng() - 0.5) * 3, w * 0.6, hh * 0.7, w * 0.6, shadeC(g, 1.08));
  }
  // pines
  for (const [x, z] of [[-18, -108], [9, -110], [-44.5, -12.5], [-11.5, 38.5], [-15.5, -96], [4, -92], [-56, 9], [33, -36], [-38.5, 66], [63, -66]]) {
    const t = tinfo(x, z);
    if (t.rl < 1.5) continue;
    pineG[Math.floor(rng() * 2)].add(x, groundMin(x, z, 0.4) - 0.1, z, rot4(), 0.9 + rng() * 0.3);
  }
  // bamboo groves
  for (const [cx, cz, r, n] of [[-62, 26, 13, 70], [-27, -30, 9, 40], [66, 34, 10, 40]]) {
    for (let i = 0; i < n * F; i++) {
      const a = rng() * TAU, d = Math.sqrt(rng()) * r, x = cx + Math.cos(a) * d, z = cz + Math.sin(a) * d;
      const t = tinfo(x, z);
      if (t.slope > 1.3 || t.rl < 3 || blocked(x, z, 2, 2)) continue;
      bambooGr[Math.floor(rng() * 2)].add(x, t.h - 0.05, z, rot4(), 0.85 + rng() * 0.3);
    }
  }
  // rocks: shore, pool, foreground
  const S = riverLower.samples;
  for (let k = 0; k < S.length; k += 4) {
    const s = S[k];
    if (s.z > 175) continue;
    for (const side of [-1, 1]) {
      if (rng() > 0.42) continue;
      const off = s.w + (rng() - 0.35) * 2.2;
      const x = s.x - s.tz * off * side, z = s.z + s.tx * off * side;
      if (pathDist(x, z) < 1.5 || padDist(x, z) < 0.5) continue;
      if (Math.abs(x - 12) < 11 && Math.abs(z - 2) < 3) continue;
      const v = rng() < 0.5 ? 1 : rng() < 0.6 ? 0 : 3;
      const wet = off < s.w + 0.3;
      rockGr[v].add(x, Math.max(groundAt(x, z), -1.6) - 0.1, z, rot4(), 0.55 + rng() * 0.7, wet ? 0x9a9a9e : 0xdedede);
    }
  }
  for (const [x, z, s, v] of [[-24.5, 58.5, 1.2, 0], [-20.2, 57.6, 0.7, 3], [-36, 68.5, 1.2, 2], [-27.5, 61, 0.9, 1], [-14.5, 66, 1.0, 1], [-12.6, 58, 0.9, 0], [-17.5, 55.5, 0.7, 3],
    [-11, -95, 1.3, 2], [-1.5, -93, 1.1, 0], [-13, -99, 1.0, 1], [0.5, -99, 0.9, 2], [-9, 26.8, 0.8, 1], [-42, -4.5, 0.7, 3], [17, 19.8, 0.7, 1]]) {
    rockGr[v].add(x, groundAt(x, z) - 0.1, z, rot4(), s, 0xe4e4e4);
  }
  // shrubs near buildings and paths
  for (let i = 0; i < 380 * F; i++) {
    const x = -70 + rng() * 140, z = -60 + rng() * 150;
    const pd = pathDist(x, z), pa = padDist(x, z);
    const near = (pd > 1.8 && pd < 3.5) || (pa > 0.3 && pa < 2.2);
    if (!near || rng() < 0.35) continue;
    const t = tinfo(x, z);
    if (t.rl < 1.5 || t.slope > 0.9 || inViewCorridor(x, z) && rng() < 0.6) continue;
    shrubG[Math.floor(rng() * 3)].add(x, t.h - 0.05, z, rot4(), 0.7 + rng() * 0.6);
  }
  // grass tufts + reeds
  const grassN = Math.round(7000 * GEO.grass);
  let grassCount = 0;

    const x = -72 + rng() * 144, z = -52 + rng() * 152;
    const t = tinfo(x, z);
    if (t.h < 0.2 || t.pw > 0.3 || t.slope > 0.9 || t.h > 22) continue;
    const focus = Math.max(smooth(10, 2, t.rl), smooth(5, 1.5, pathDist(x, z)), smooth(40, 15, Math.hypot(x + 24, z - 70)));
    if (rng() > 0.15 + focus) continue;
    grassCount++;
    if (t.rl < 1.6) { if (t.rl > -0.2 && rng() < 0.9) reedGr.add(x, t.h - 0.02, z, rot4(), 0.8 + rng() * 0.6); continue; }
    if (padDist(x, z) < -0.5) continue;
    grassGr[Math.floor(rng() * 2)].add(x, t.h - 0.02, z, rot4(), 0.8 + rng() * 0.7);
  }
  for (let k = 0; k < S.length; k += 2) {
    const s = S[k];
    if (s.z > 120 || s.z < -90) continue;
    for (const side of [-1, 1]) {
      if (rng() > 0.4 * GEO.grass) continue;
      const off = s.w + 0.2 + rng() * 1.4;
      const x = s.x - s.tz * off * side, z = s.z + s.tx * off * side;
      if (pathDist(x, z) < 1.4 || (Math.abs(x - 12) < 12 && Math.abs(z - 2) < 3)) continue;
      const g = groundAt(x, z);
      if (g < 0.1) continue;
      reedGr.add(x, g - 0.02, z, rot4(), 0.8 + rng() * 0.6);
    }
  }
  // fireflies live near water and grass
  for (let i = 0; i < 260; i++) {
    const k = Math.floor(rng() * S.length);
    const s = S[k];
    if (s.z < -80 || s.z > 110) continue;
    const off = s.w + 0.5 + rng() * 6, side = rng() < 0.5 ? -1 : 1;
    const x = s.x - s.tz * off * side, z = s.z + s.tx * off * side;
    WORLD.firefliesAt.push([x, groundAt(x, z) + 0.4 + rng() * 1.8, z, rng()]);
  }
  // build all groups
  for (const g of [...cherryG, weepG, ...cedarNG, ...cedarFG, ...pineG, ...mapleG, ...shrubG, ...grassGr, reedGr, ...rockGr, ...bambooGr]) g.build(scene);
  boxes.build(scene);
}

const WATER = {
  bounds: { x0: -48, z0: -108, x1: 58, z1: 250 },
  U: {
    uTime: ATMO.uTime,
    uDeep: { value: new THREE.Color() }, uShallow: { value: new THREE.Color() }, uAmb: { value: new THREE.Color(1, 1, 1) },
    uSunDir: { value: new THREE.Vector3(0, 1, 0) }, uSunCol: { value: new THREE.Color() }, uFoam: { value: new THREE.Color(0.8, 0.85, 0.9) },

    uSkyZen: { value: new THREE.Color() }, uSkyHor: { value: new THREE.Color() },
    tWave: { value: null },
  },

function makeWaveTexture(size = 256) {
  const rng = mulberry32(5);
  const waves = [];
  for (let i = 0; i < 30; i++) {
    let kx, ky;
    do { kx = Math.round((rng() * 2 - 1) * 12); ky = Math.round((rng() * 2 - 1) * 12); } while (kx * kx + ky * ky < 5);
    const k = Math.hypot(kx, ky);
    waves.push({ kx, ky, a: 1 / Math.pow(k, 1.35), ph: rng() * TAU });
  }
  const n = size * size;
  const SX = new Float32Array(n), SY = new Float32Array(n), HH = new Float32Array(n), FB = new Float32Array(n);
  let mx = 1e-6, hmin = 1e9, hmax = -1e9, fmin = 1e9, fmax = -1e9;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const u = x / size, v = y / size;
    let h = 0, sx = 0, sy = 0, fb = 0;
    for (let i = 0; i < waves.length; i++) {
      const w = waves[i];
      const arg = TAU * (w.kx * u + w.ky * v) + w.ph;
      const s = Math.sin(arg), c = Math.cos(arg);
      h += w.a * s; sx += w.a * TAU * w.kx * c; sy += w.a * TAU * w.ky * c;
      if (i % 3 === 0) fb += w.a * Math.sin(arg * 1 + i);
    }
    const id = x + y * size;
    SX[id] = sx; SY[id] = sy; HH[id] = h; FB[id] = fb;
    mx = Math.max(mx, Math.abs(sx), Math.abs(sy));
    hmin = Math.min(hmin, h); hmax = Math.max(hmax, h); fmin = Math.min(fmin, fb); fmax = Math.max(fmax, fb);
  }
  const data = new Uint8Array(n * 4);
  for (let i = 0; i < n; i++) {
    data[i * 4] = Math.round(clamp(SX[i] / mx * 0.5 + 0.5, 0, 1) * 255);
    data[i * 4 + 1] = Math.round(clamp(SY[i] / mx * 0.5 + 0.5, 0, 1) * 255);
    data[i * 4 + 2] = Math.round(((FB[i] - fmin) / (fmax - fmin)) * 255);
    data[i * 4 + 3] = Math.round(((HH[i] - hmin) / (hmax - hmin)) * 255);
  }
  const t = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter; t.generateMipmaps = true;
  t.anisotropy = 4;
  t.needsUpdate = true;
  return t;
}

function makeWaterData(b) {
  const res = 0.5;
  const nx = Math.round((b.x1 - b.x0) / res), nz = Math.round((b.z1 - b.z0) / res);
  const dq = new Float32Array(nx * nz), fx = new Float32Array(nx * nz), fz = new Float32Array(nx * nz);
  for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {
    const x = b.x0 + (i + 0.5) * res, z = b.z0 + (j + 0.5) * res;
    const id = i + j * nx;
    if (z < cliffZ(x) - 0.2) continue;
    const g = groundAt(x, z);
    dq[id] = Math.max(0, WATER_Y - g);
    if (dq[id] > 0) {
      const k = riverLower.query(x, z);
      if (k >= 0) {
        const s = riverLower.samples[k];
        const sp = clamp(0.35 + 0.65 * (1 - riverLower.qd / s.w), 0.15, 1) * (s.w > 8.5 ? 0.45 : 1);
        fx[id] = s.tx * sp; fz[id] = s.tz * sp;
      }
    }
  }
  // blurred depth for colour
  const blur = new Float32Array(nx * nz), tmp = new Float32Array(nx * nz);
  const R = 3;
  for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) { let s = 0, c = 0; for (let k = -R; k <= R; k++) { const ii = i + k; if (ii < 0 || ii >= nx) continue; s += dq[ii + j * nx]; c++; } tmp[i + j * nx] = s / c; }
  for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) { let s = 0, c = 0; for (let k = -R; k <= R; k++) { const jj = j + k; if (jj < 0 || jj >= nz) continue; s += tmp[i + jj * nx]; c++; } blur[i + j * nx] = s / c; }
  const data = new Uint8Array(nx * nz * 4);
  for (let i = 0; i < nx * nz; i++) {
    data[i * 4] = Math.round(clamp(dq[i] / 3, 0, 1) * 255);
    data[i * 4 + 1] = Math.round(clamp(fx[i] * 0.5 + 0.5, 0, 1) * 255);
    data[i * 4 + 2] = Math.round(clamp(fz[i] * 0.5 + 0.5, 0, 1) * 255);
    data[i * 4 + 3] = Math.round(clamp(Math.max(blur[i], dq[i] * 0.6) / 3, 0, 1) * 255);
  }
  const t = new THREE.DataTexture(data, nx, nz, THREE.RGBAFormat);
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearFilter; t.generateMipmaps = false;
  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
  t.needsUpdate = true;
  return t;
}

const WATER_GLSL_COMMON = /* glsl */`
  uniform float uTime;
  uniform vec3 uDeep; uniform vec3 uShallow; uniform vec3 uAmb; uniform vec3 uSunDir; uniform vec3 uSunCol; uniform vec3 uFoam;
  uniform float uRain; uniform float uSpec; uniform float uReflMin; uniform float uDistort; uniform float uChop;
  uniform sampler2D tWave;
  vec2 waveSlope( vec2 uv ) { return texture2D( tWave, uv ).xy * 2.0 - 1.0; }
  float hash12( vec2 p ) { vec3 p3 = fract( vec3( p.xyx ) * 0.1031 ); p3 += dot( p3, p3.yzx + 33.33 ); return fract( ( p3.x + p3.y ) * p3.z ); }
  vec2 rainRip( vec2 p, float t ) {
    vec2 acc = vec2( 0.0 );
    for ( int k = 0; k < 3; k++ ) {
      vec2 q = p * ( 1.25 + float( k ) * 0.55 ) + float( k ) * 17.13;
      vec2 cell = floor( q ); vec2 f = fract( q ) - 0.5;
      float r1 = hash12( cell + float( k ) * 3.1 );
      float tt = fract( t * ( 0.7 + 0.35 * r1 ) + r1 );
      vec2 off = vec2( hash12( cell + 5.3 ), hash12( cell + 9.1 ) ) - 0.5;
      vec2 d = f - off * 0.5;
      float r = length( d );
      float x = ( r - tt * 0.5 ) * 26.0;
      float w = ( 1.0 - tt ) * ( 1.0 - tt ) * exp( -x * x );
      acc += d / max( r, 1e-3 ) * w * sin( x * 2.2 );
    }
    return acc;
  }
`;

const RIVER_SHADER = {
  name: 'SakuraRiver',
  uniforms: Object.assign({ color: { value: null }, tDiffuse: { value: null }, textureMatrix: { value: null }, tData: { value: null }, uBounds: { value: new THREE.Vector4() } }, THREE.UniformsLib.fog),
  vertexShader: /* glsl */`
    uniform mat4 textureMatrix;
    varying vec4 vUv;
    varying vec3 vWorld;
    #include <common>
    #include <fog_pars_vertex>
    void main() {
      vec3 transformed = position;
      vec4 wp = modelMatrix * vec4( position, 1.0 );
      vWorld = wp.xyz;
      vUv = textureMatrix * vec4( position, 1.0 );
      vec4 mvPosition = viewMatrix * wp;
      gl_Position = projectionMatrix * mvPosition;
      #include <fog_vertex>
    }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse;
    uniform sampler2D tData;
    uniform vec4 uBounds;
    varying vec4 vUv;
    varying vec3 vWorld;
    #include <common>
    ${WATER_GLSL_COMMON}
    #include <fog_pars_fragment>
    void main() {
      vec2 duv = ( vWorld.xz - uBounds.xy ) * uBounds.zw;
      vec4 wd = texture2D( tData, duv );
      float mask = wd.r * 3.0;
      if ( mask < 0.02 ) discard;
      float depth = wd.a * 3.0;
      vec2 flow = wd.gb * 2.0 - 1.0;
      float dist = length( cameraPosition - vWorld );
      float ph = uTime * 0.075;
      float p0 = fract( ph ), p1 = fract( ph + 0.5 );
      float wB = abs( p0 - 0.5 ) * 2.0;
      vec2 base = vWorld.xz * 0.085;
      vec2 sA = waveSlope( base - flow * p0 * 1.7 );
      vec2 sB = waveSlope( base - flow * p1 * 1.7 + vec2( 0.37, 0.71 ) );
      vec2 s1 = mix( sA, sB, wB );
      vec2 s2 = waveSlope( vWorld.xz * 0.021 + vec2( uTime * 0.0035, -uTime * 0.0025 ) );
      vec2 s3 = waveSlope( vWorld.xz * 0.33 - flow * uTime * 0.11 + 0.5 );
      vec2 slope = s1 * 0.5 + s2 * 0.38 + s3 * 0.22 * ( 1.0 - smoothstep( 8.0, 50.0, dist ) );
      slope += rainRip( vWorld.xz, uTime ) * uRain * ( 1.0 - smoothstep( 12.0, 70.0, dist ) ) * 1.8;
      slope *= uChop * mix( 1.0, 0.3, smoothstep( 25.0, 260.0, dist ) );
      vec3 N = normalize( vec3( -slope.x, 1.0, -slope.y ) );
      vec3 V = normalize( cameraPosition - vWorld );
      float cosT = clamp( dot( V, N ), 0.0, 1.0 );
      float F = 0.02 + 0.98 * pow( 1.0 - cosT, 5.0 );
      float R = clamp( uReflMin + F * ( 1.0 - uReflMin ), 0.0, 1.0 );
      vec4 ruv = vUv;
      ruv.xy += N.xz * ( uDistort / ( 1.0 + dist * 0.025 ) ) * ruv.w;
      vec3 refl = texture2DProj( tDiffuse, ruv ).rgb;
      float dT = 1.0 - exp( -depth * 0.8 );
      vec3 body = mix( uShallow, uDeep, dT ) * uAmb;
      vec3 col = mix( body, refl, R );
      vec3 H = normalize( V + uSunDir );
      col += uSunCol * pow( max( dot( N, H ), 0.0 ), 260.0 ) * uSpec;
      float shore = 1.0 - smoothstep( 0.0, 0.3, mask );
      float fn = texture2D( tWave, vWorld.xz * 0.37 + flow * uTime * 0.06 ).b;
      col = mix( col, uFoam * uAmb, shore * smoothstep( 0.42, 0.85, fn ) * 0.3 );
      float alpha = mix( 0.42, 0.94, smoothstep( 0.15, 2.0, depth ) );
      alpha = max( alpha, R );
      alpha *= smoothstep( 0.02, 0.16, mask );
      gl_FragColor = vec4( col, alpha );
      #include <fog_fragment>
    }`,
};

function createRiver(scene) {
  const b = WATER.bounds;
  const W = b.x1 - b.x0, D = b.z1 - b.z0;
  const tw = QUALITY === 'lite' ? 256 : 512;
  const river = new Reflector(new THREE.PlaneGeometry(W, D), { textureWidth: tw, textureHeight: tw, clipBias: 0.002, multisample: QUALITY === 'lite' ? 0 : 4, shader: RIVER_SHADER });
  river.rotation.x = -Math.PI / 2;
  river.position.set((b.x0 + b.x1) / 2, WATER_Y, (b.z0 + b.z1) / 2);
  const m = river.material;
  m.transparent = true; m.fog = true; m.depthWrite = true;
  for (const k in WATER.U) m.uniforms[k] = WATER.U[k];
  for (const k in ATMO) m.uniforms[k] = ATMO[k];
  m.uniforms.tData.value = makeWaterData(b);
  m.uniforms.uBounds.value.set(b.x0, b.z0, 1 / W, 1 / D);
  river.renderOrder = 1;
  scene.add(river);
  WATER.river = river;
  return river;
}

// z of the cliff face (first low column scanning south from the cliff line)
function lipZ(x) {
  for (let z = cliffZ(x) - 3; z < cliffZ(x) + 6; z += 0.25) if (groundAt(x, z) < 7) return z;
  return cliffZ(x) + 2;
}
// upper stream ribbon (no planar reflection; sky-tinted)
function createUpperStream(scene) {
  const S = riverUpper.samples;
  const pos = [], uv = [], idx = [];
  let acc = 0;
  let first = true, prev = null, k = 0;
  for (let i = 0; i < S.length; i += 2) {
    const s = S[i];
    if (s.z > lipZ(s.x) - 0.3) continue;   // stop exactly at the cliff lip
    if (prev) acc += Math.hypot(s.x - prev.x, s.z - prev.z);

  const rs = QUALITY === 'high' ? 0.5 : 0.35;
  WATER.river.getRenderTarget().setSize(Math.max(256, Math.round(w * pr * rs)), Math.max(256, Math.round(h * pr * rs)));
  R.bloom.setSize(Math.round(w * pr * 0.5), Math.round(h * pr * 0.5));
  FX.U.uPR.value = pr;
  R.vignette.uniforms.uAspect.value = w / h;
}

const VignetteShader = {
  uniforms: { tDiffuse: { value: null }, uAmount: { value: 0.32 }, uAspect: { value: 1 } },
  vertexShader: /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 ); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform float uAmount; uniform float uAspect; varying vec2 vUv;
    float h12( vec2 p ) { vec3 p3 = fract( vec3( p.xyx ) * 0.1031 ); p3 += dot( p3, p3.yzx + 33.33 ); return fract( ( p3.x + p3.y ) * p3.z ); }
    void main() {
      vec4 c = texture2D( tDiffuse, vUv );
      vec2 d = ( vUv - 0.5 ) * vec2( uAspect, 1.0 ) / max( uAspect, 1.0 );
      c.rgb *= 1.0 - uAmount * smoothstep( 0.2, 0.95, length( d ) * 1.25 );
      c.rgb += ( h12( gl_FragCoord.xy ) - 0.5 ) / 255.0;
      gl_FragColor = c;
    }`,
};

async function main() {
  const stage = $id('stage');
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', alpha: false, stencil: false });
  } catch (err) {
    BOOT.fatal('当前浏览器无法创建 WebGL 画布', '请确认浏览器已开启硬件加速，或换用新版 Chrome、Edge、Firefox、Safari。', err);
    return;
  }
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false;
  renderer.info.autoReset = false;
  renderer.setPixelRatio(basePixelRatio());
  renderer.setSize(window.innerWidth, window.innerHeight);
  stage.appendChild(renderer.domElement);
  renderer.domElement.setAttribute('tabindex', '0');
  renderer.domElement.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    BOOT.ready = false;
    BOOT.failed = false;
    BOOT.fatal('图形资源已被系统回收', '显卡上下文丢失（常见于切换应用、休眠或显存不足）。请重新加载页面继续游览。');
  });
  R.renderer = renderer;

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x4a5784, 0.006);
  R.scene = scene;
  const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.25, 3200);
  camera.layers.enable(LAYER_NOREFLECT);
  R.camera = camera;

  // lights
  const sunTarget = new THREE.Object3D(); sunTarget.position.set(8, 0, -12); scene.add(sunTarget);
  const sun = new THREE.DirectionalLight(0xffffff, 1);
  sun.target = sunTarget;
  sun.castShadow = true;
  const sm = QUALITY === 'high' ? 4096 : 2048;
  sun.shadow.mapSize.set(sm, sm);
  Object.assign(sun.shadow.camera, { left: -175, right: 175, top: 175, bottom: -175, near: 20, far: 900 });
  sun.shadow.camera.updateProjectionMatrix();
  sun.shadow.bias = -0.00025;
  sun.shadow.normalBias = 0.05;
  scene.add(sun);
  const hemi = new THREE.HemisphereLight(0x5a6eaf, 0x29283a, 0.3);
  scene.add(hemi);
  Object.assign(R, { sun, sunTarget, hemi });

  // world
  await buildWorld(scene, BOOT.status);
  BOOT.status('注入河水', 0.84); await nextFrame();
  WATER.U.tWave.value = makeWaveTexture(256);
  createRiver(scene);
  createUpperStream(scene);
  createWaterfall(scene);
  createKoi(scene);
  createFloatingPetals(scene);
  // sky + environment
  const sky = createSkyMesh();
  scene.add(sky);
  const envScene = new THREE.Scene();
  envScene.add(new THREE.Mesh(sky.geometry, sky.material));
  const pmrem = new THREE.PMREMGenerator(renderer);
  let envRT = null;
  R.updateEnv = () => {
    SKY.uStars.value = 0; const st = MOOD.cur.n.stars; // stars do not light the scene
    const rt = pmrem.fromScene(envScene, 0, 0.5, 400);
    SKY.uStars.value = st;
    scene.environment = rt.texture;
    if (envRT) envRT.dispose();
    envRT = rt;
  };
  // particles
  const nearN = QUALITY === 'lite' ? 320 : 800, farN = QUALITY === 'lite' ? 700 : 1700;
  R.petalsNear = createPetalField(nearN, [30, 18, 30], 0.085);
  R.petalsFar = createPetalField(farN, [120, 40, 120], 0.11);
  scene.add(R.petalsNear, R.petalsFar);
  R.fireflies = createFireflies(WORLD.firefliesAt);
  scene.add(R.fireflies);
  R.rain = createRain(QUALITY === 'lite' ? 2600 : 6500);
  scene.add(R.rain);
  const smokeCol = FX.U.uSmokeCol;
  scene.add(createSoftSprites(WORLD.smoke, 26, { life: 9, rise: 7, spread: 1.6, size: 1.6, alpha: 0.22, color: smokeCol }));
  const mistOrigins = [];
  for (let i = 0; i < 6; i++) mistOrigins.push(WATER.fallBase.clone().add(new THREE.Vector3((i - 2.5) * 1.2, 0.2, (i % 2) * 1.2)));
  const mistU = { value: new THREE.Color(0.85, 0.88, 0.92) };
  R.mistColor = mistU;
  scene.add(createSoftSprites(mistOrigins, 46, { life: 6, rise: 6, spread: 4.5, size: 3.6, alpha: 0.2, color: mistU }));
  R.birds = createBirds(9);
  scene.add(R.birds.mesh);

  // post
  BOOT.status('编译着色器', 0.9); await nextFrame();
  const rt = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, { type: THREE.HalfFloatType, samples: QUALITY === 'lite' ? 2 : 4 });
  const composer = new EffectComposer(renderer, rt);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth / 2, window.innerHeight / 2), 0.6, 0.5, 0.85);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
  const vignette = new ShaderPass(VignetteShader);
  composer.addPass(vignette);
  Object.assign(R, { composer, bloom, vignette });

  // controls
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.075;
  controls.rotateSpeed = 0.55; controls.zoomSpeed = 0.9; controls.panSpeed = 0.7;
  controls.minDistance = 2.5; controls.maxDistance = 300;
  controls.maxPolarAngle = Math.PI * 0.6; // allow gentle upward looks; terrain collision keeps the camera above ground
  controls.zoomToCursor = true;
  controls.screenSpacePanning = false;
  R.controls = controls;

  resize();
  window.addEventListener('resize', resize);
  setMood('dusk', true);
  goView('panorama', true);
  initUI();
  reducedMQ.addEventListener?.('change', (e) => { REDUCED = e.matches; applyMotion(); });
  applyMotion();

  renderer.shadowMap.needsUpdate = true;
  if (renderer.compileAsync) { try { await renderer.compileAsync(scene, camera); } catch (err) { /* compile on first frame instead */ } }
  BOOT.status('即将完成', 0.98);
  renderer.render(scene, camera);
  composer.render(0.016);
  BOOT.ready = true;
  BOOT.done();
  start();
}
function applyMotion() {
  MATU.uFlicker.value = REDUCED ? 0 : 1;
  SKY.uTwinkle.value = REDUCED ? 0 : 1;
  FX.U.uMotion.value = REDUCED ? 0.3 : 1;
  for (const p of [R.petalsNear, R.petalsFar]) if (p) p.material.uniforms.uSpeed.value = REDUCED ? 0.35 : 1;
}

let T = 0;
function start() {
  const clock = new THREE.Clock();
  const R_ = R;
  R_.renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    T += dt;
    R_.renderer.info.reset();
    ATMO.uTime.value = T;
    // camera
    if (!updateTransition(dt) && !updateTour(dt)) {
      updateKeys(dt);
      R_.controls.update(dt);
    }
    constrainCamera();
    // world animation
    updateMood(dt);
    const cam = R_.camera.position;
    R_.petalsNear.material.uniforms.uCenter.value.set(cam.x, cam.y + 2, cam.z);
    const tg = R_.controls.target;
    R_.petalsFar.material.uniforms.uCenter.value.set(lerp(cam.x, tg.x, 0.5), Math.max(tg.y, groundAt(tg.x, tg.z)) + 14, lerp(cam.z, tg.z, 0.5));
    R_.rain.material.uniforms.uCenter.value.set(cam.x, cam.y + 4, cam.z);
    updateKoi(T);
    updateFloatingPetals(dt, T);
    updateBirds(R_.birds, T, R_.birdCount || 0);
    if (WORLD.wheel) WORLD.wheel.rotation.x -= dt * (REDUCED ? 0.15 : 0.45);
    updateAudio();
    R_.composer.render(dt);
    if (R_.shotPending) captureShot();
    // adaptive resolution
    if (!TEST) {
      PERF.acc += dt; PERF.n++; PERF.cool -= dt;
      if (PERF.n >= 90) {
        const avg = PERF.acc / PERF.n; PERF.acc = 0; PERF.n = 0;
        if (avg > 0.036 && PERF.scale > 0.6 && PERF.cool <= 0) { PERF.scale = Math.max(0.6, PERF.scale - 0.12); resize(); PERF.cool = 3; }
        else if (avg < 0.019 && PERF.scale < 1 && PERF.cool <= 0) { PERF.scale = Math.min(1, PERF.scale + 0.06); resize(); PERF.cool = 5; }
      }
    }
  });
}

// test hooks (used for automated screenshots)
window.__sakura = {
  get ready() { return !!BOOT.ready; },
  setView: (v, instant = true) => goView(v, instant),
  setMood: (m, instant = true) => setMood(m, instant),
  setPose: (pos, tgt, fov) => { flyTo(new THREE.Vector3(...pos), new THREE.Vector3(...tgt), fov || R.camera.fov, true); },
  info: () => ({ calls: R.renderer.info.render.calls, triangles: R.renderer.info.render.triangles, geometries: R.renderer.info.memory.geometries, textures: R.renderer.info.memory.textures, pr: R.renderer.getPixelRatio() }),
  frames: (n = 2) => new Promise((res) => { let k = 0; const f = () => { if (++k >= n) res(); else requestAnimationFrame(f); }; requestAnimationFrame(f); }),
  shot: () => { R.shotPending = true; },
  ui: (hidden) => setUIHidden(hidden),
  tweak: (name, o) => { Object.assign(MOOD_DEFS[name], o); MOODS[name] = compileMood(MOOD_DEFS[name]); setMood(name, true); },
  defs: () => MOOD_DEFS,
  finish: () => { if (CAMS.trans) { CAMS.trans.t = 0.999; } if (MOOD.t < 1) MOOD.t = 0.999; },
  state: () => ({ view: CAMS.view, mood: MOOD.name, tour: !!CAMS.tour, trans: !!CAMS.trans, quality: QUALITY, audio: AUDIO.on, uiHidden: document.getElementById('ui').classList.contains('off'), shotOpen: !document.getElementById('shot').hidden, cam: R.camera.position.toArray().map((v) => +v.toFixed(1)) }),
};

try {
  await main();
} catch (err) {
  BOOT.fatal('场景生成失败', '生成景观时发生错误。请刷新重试；若问题持续，请换用桌面版 Chrome 或 Edge。', err);
  throw err;
}

</script>
</body>
</html>
